<header class="header">
  <div class="left-section">
    <button class="icon-button" aria-label="Menu"><span class="material-symbols-outlined">menu</span></button>
    <a class="youtube-logo" href="https://www.youtube.com/" aria-label="YouTube home">
      <span class="youtube-play"><span class="material-symbols-outlined">play_arrow</span></span>
      <span class="logo-word">YouTube</span><sup>NG</sup>
    </a>
  </div>
  <div class="middle-section">
    <form class="search-form" action="https://www.youtube.com/results" method="get">
      <input class="search-bar" type="search" name="search_query" placeholder="Search" aria-label="Search">
      <button class="search-button" aria-label="Search"><span class="material-symbols-outlined">search</span></button>
    </form>
    <button class="voice-button" aria-label="Voice search"><span class="material-symbols-outlined">mic</span></button>
  </div>
  <div class="right-section">
    <a class="header-action" href="icons/upload.svg" aria-label="Create"><span class="material-symbols-outlined">video_call</span></a>
    <a class="header-action" href="icons/youtube-apps.svg" aria-label="Apps"><span class="material-symbols-outlined">apps</span></a>
    <a class="header-action notification" href="icons/notifications.svg" aria-label="Notifications"><span class="material-symbols-outlined">notifications</span><span class="notification-count">3</span></a>
    <a class="user-avatar" href="https://www.youtube.com/" aria-label="Your account">D</a>
  </div>
</header>
